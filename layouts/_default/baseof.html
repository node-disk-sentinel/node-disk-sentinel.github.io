<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ $desc := .Description | default .Site.Params.description }}
  <title>{{ if .IsHome }}{{ .Site.Title }} · {{ $desc }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ $desc }}">
  
  <!-- Open Graph & Twitter -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }} · {{ $desc }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ $desc }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }} · {{ $desc }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:description" content="{{ $desc }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">
  
  <!-- CSS -->
  {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
  <!-- Theme initialization to prevent flash -->
  <script>
    (function() {
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme) {
        document.documentElement.setAttribute('data-theme', storedTheme);
      }
    })();
  </script>
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
